services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-projecta1}
      POSTGRES_USER: ${POSTGRES_USER:-projecta1}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  api:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://projecta1:change-me@db:5432/projecta1}
      CORS_ORIGINS: http://localhost:3000
    ports: ["8000:8000"]
    depends_on: [db]
  web:
    build: .
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres-data:
